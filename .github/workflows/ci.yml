name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  # Runs the README demo: the unchanged suite must pass, vague descriptions
  # must be caught as a regression.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build -o toolgauge ./cmd/toolgauge
      - run: ./toolgauge validate examples/github-issues/suite.yaml
      - run: ./toolgauge run --out baseline.json examples/github-issues/suite.yaml
      - run: ./toolgauge run --seed 7 --out rerun.json examples/github-issues/suite.yaml
      - name: Rerun with another seed is not a regression
        run: ./toolgauge compare baseline.json rerun.json
      - name: Vague descriptions are caught
        run: |
          ./toolgauge run --descriptions examples/github-issues/descriptions-vague.yaml \
            --out vague.json examples/github-issues/suite.yaml
          set +e
          ./toolgauge compare baseline.json vague.json
          code=$?
          set -e
          test "$code" -eq 1
